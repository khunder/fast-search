name: Release

# Pushing a tag like v0.2.0 (or 0.2.0) tests, builds the packages and the
# Windows installer and publishes them as a GitHub release; the programs
# report the tag as their version, and `ff update` installs from it. It
# can also be run by hand to check the packaging; the packages are then
# attached to the workflow run instead.
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take the version from the tag
        run: echo "FF_VERSION=$(sh packaging/version.sh)" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm squashfs-tools
          # Installs the nightly pinned in rust-toolchain.toml, with the
          # standard library sources and the musl target.
          rustup show active-toolchain || rustup toolchain install

      - name: Test
        run: cargo test

      - name: Build packages
        run: packaging/build-packages.sh

      - name: Check the packages
        run: |
          set -eux
          ls dist/fast-search-x86_64.tar.gz dist/fast-search-amd64.deb \
             dist/fast-search-x86_64.rpm dist/fast-search-x86_64.AppImage
          # deb: install it for real and run what it installed.
          sudo dpkg -i dist/fast-search-amd64.deb
          ff --version
          ff-gui --version
          ffd --help
          test -f /usr/share/applications/ff-gui.desktop
          # rpm: metadata and file list.
          rpm -qip dist/fast-search-x86_64.rpm
          rpm -qlp dist/fast-search-x86_64.rpm | grep -x /usr/bin/ff-gui
          # AppImage: run a program from inside it (no FUSE on the runner).
          dist/fast-search-x86_64.AppImage --appimage-extract-and-run ff --version

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the version from the tag
        shell: bash
        run: echo "FF_VERSION=$(sh packaging/version.sh)" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo win
      - name: Check the version
        shell: bash
        run: target/x86_64-pc-windows-msvc/release/ff.exe --version | grep -Fx "ff $FF_VERSION"
      - name: Build the installer
        shell: pwsh
        run: packaging/windows/build-installer.ps1
      - name: Zip the programs
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release"
          Compress-Archive -Path "$bin/ff.exe", "$bin/ff-gui.exe", "$bin/ffd.exe", README.md, LICENSE -DestinationPath dist/fast-search-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/

  publish:
    needs: [packages, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Fast search $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
