[package]
name = "ff-gui"
description = "ff-gui: instant file search window (native Wayland and X11, no toolkit)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ff-core = { path = "../ff-core" }

# Windows draws text with GDI; elsewhere fonts are read and drawn here.
[target.'cfg(not(windows))'.dependencies]
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
